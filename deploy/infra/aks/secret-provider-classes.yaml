apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tournament-services-config
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: __AKS_IDENTITY_CLIENT_ID__
    keyvaultName: __KEYVAULT_NAME__
    tenantId: __TENANT_ID__
    objects: |
      array:
        - |
          objectName: tournament-services-config-aks
          objectType: secret
          objectAlias: configuration.json
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tournament-consumer-config
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: __AKS_IDENTITY_CLIENT_ID__
    keyvaultName: __KEYVAULT_NAME__
    tenantId: __TENANT_ID__
    objects: |
      array:
        - |
          objectName: tournament-consumer-config-aks
          objectType: secret
          objectAlias: configuration.json
