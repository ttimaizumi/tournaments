# Pods also reference the secret "secrets-store-creds" (service principal),
# created once by bootstrap/onprem.sh
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tournament-services-config
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    keyvaultName: __KEYVAULT_NAME__
    tenantId: __TENANT_ID__
    objects: |
      array:
        - |
          objectName: tournament-services-config-onprem
          objectType: secret
          objectAlias: configuration.json
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tournament-consumer-config
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    keyvaultName: __KEYVAULT_NAME__
    tenantId: __TENANT_ID__
    objects: |
      array:
        - |
          objectName: tournament-consumer-config-onprem
          objectType: secret
          objectAlias: configuration.json
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tournament-db-migrations
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    keyvaultName: __KEYVAULT_NAME__
    tenantId: __TENANT_ID__
    objects: |
      array:
        - |
          objectName: tournament-db-flyway-conf
          objectType: secret
          objectAlias: flyway.conf
