apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tournaments
resources:
  - tournament-services.yaml
  - tournament-consumer.yaml
images:
  # newTag is set by Jenkins to the commit being released; overlays set the registry
  - name: tournament-services
    newTag: latest
  - name: tournament-consumer
    newTag: latest
