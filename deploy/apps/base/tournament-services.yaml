apiVersion: v1
kind: Service
metadata:
  name: tournament-services
  labels:
    app: tournament-services
spec:
  selector:
    app: tournament-services
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tournament-services
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tournament-services
  template:
    metadata:
      labels:
        app: tournament-services
    spec:
      serviceAccountName: tournaments
      containers:
        - name: tournament-services
          image: tournament-services
          # configuration.json is read from the working directory
          command: ["/app/tournament_services"]
          workingDir: /config
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: config
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: tournament-services-config
