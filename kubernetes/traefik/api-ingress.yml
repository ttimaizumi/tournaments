apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tournaments-api
  namespace: tournaments
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: tournaments.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tournaments-api
                port:
                  number: 8080
