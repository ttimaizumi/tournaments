apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis
  namespace: tournaments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artemis
  template:
    metadata:
      labels:
        app: artemis
    spec:
      containers:
        - name: activemq
          image: apache/activemq-classic:6.1.7
          ports:
            - containerPort: 61616
            - containerPort: 8161
          readinessProbe:
            tcpSocket:
              port: 61616
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: artemis
  namespace: tournaments
spec:
  selector:
    app: artemis
  ports:
    - name: broker
      port: 61616
    - name: console
      port: 8161
